{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <h2 class="text-2xl font-bold mb-5">Write Device Data</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label for="device_id" class="block text-sm font-medium text-gray-700">Device ID</label>
            <input type="text" id="device_id" name="device_id" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
        <div class="mb-4">
            <label for="temperature" class="block text-sm font-medium text-gray-700">Temperature</label>
            <input type="number" step="0.1" id="temperature" name="temperature" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
        <div class="mb-4">
            <label for="humidity" class="block text-sm font-medium text-gray-700">Humidity</label>
            <input type="number" step="0.1" id="humidity" name="humidity" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        </div>
        <button type="submit" class="btn btn-primary mt-5">Submit Data</button>
    </form>
</div>

{% endblock %}
